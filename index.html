<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rakcha - Next-Gen Group Voice, Video & Real-time Chat Experience" />
    <title>Rakcha - Next-Gen Voice & Chat Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#0B0E14",
              foreground: "#e3e2e6",
              surface: "#121316",
              "surface-bright": "#38393c",
              "surface-container-lowest": "#0d0e11",
              "surface-container-low": "#151921",
              "surface-container": "#1f1f23",
              "surface-container-high": "#1F2430",
              "surface-container-highest": "#2A2F3D",
              primary: "#6366F1",
              "primary-foreground": "#ffffff",
              secondary: "#06B6D4",
              crimson: "#F43F5E",
              "crimson-glow": "rgba(244, 63, 94, 0.25)",
              "indigo-glow": "rgba(99, 102, 241, 0.25)",
              "cyan-glow": "rgba(6, 182, 212, 0.25)",
              muted: "#1F2430",
              "muted-foreground": "#988d9f",
              "outline-variant": "#4d4354"
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              heading: ["Geist", "Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"]
            },
            animation: {
              'gradient-x': 'gradient-x 8s ease infinite',
              'float': 'float 6s ease-in-out infinite',
              'pulse-glow': 'pulse-glow 4s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s infinite',
            },
            keyframes: {
              'gradient-x': {
                '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              'pulse-glow': {
                '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                '50%': { opacity: '0.8', transform: 'scale(1.05)' },
              },
              'shimmer': {
                '100%': { transform: 'translateX(100%)' }
              }
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        html {
          font-size: 90%;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { @apply bg-surface-container-highest rounded-full; }
        ::-webkit-scrollbar-thumb:hover { @apply bg-surface-bright; }
      }
    </style>
  </head>
  <body class="bg-background text-foreground font-sans antialiased selection:bg-primary/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
